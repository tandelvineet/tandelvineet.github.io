<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="#f3f6fa"/>
<text x="60" y="72" font-family="Arial" font-size="34" font-weight="700" fill="#0b1f33">Requirements &amp; User Stories</text>
<text x="60" y="108" font-family="Arial" font-size="18" fill="#5f6b7a">Sample backlog for a reporting filter enhancement</text>
<rect x="60" y="145" width="1080" height="490" rx="24" fill="#fff" stroke="#dfe5ec" stroke-width="3"/>
<rect x="60" y="145" width="1080" height="70" rx="24" fill="#0b1f33"/>
<rect x="60" y="190" width="1080" height="25" fill="#0b1f33"/>
<text x="88" y="188" font-family="Arial" font-size="19" font-weight="700" fill="#fff">ID</text>
<text x="170" y="188" font-family="Arial" font-size="19" font-weight="700" fill="#fff">User story</text>
<text x="760" y="188" font-family="Arial" font-size="19" font-weight="700" fill="#fff">Priority</text>
<text x="930" y="188" font-family="Arial" font-size="19" font-weight="700" fill="#fff">Status</text>
<line x1="145" y1="215" x2="145" y2="635" stroke="#dfe5ec" stroke-width="2"/>
<line x1="730" y1="215" x2="730" y2="635" stroke="#dfe5ec" stroke-width="2"/>
<line x1="900" y1="215" x2="900" y2="635" stroke="#dfe5ec" stroke-width="2"/>
<g font-family="Arial" font-size="16" fill="#43505f">
<text x="88" y="266">US-01</text><text x="170" y="255">As an operations manager, I want to filter performance</text><text x="170" y="278">by region so that I can identify location-specific trends.</text><text x="760" y="266">High</text><text x="930" y="266">Ready</text>
<text x="88" y="370">US-02</text><text x="170" y="359">As an analyst, I want selected filters to remain visible</text><text x="170" y="382">so that I can interpret exported results correctly.</text><text x="760" y="370">Medium</text><text x="930" y="370">Draft</text>
<text x="88" y="474">US-03</text><text x="170" y="463">As a user, I want a one-click reset option so that I can</text><text x="170" y="486">return to the default dashboard view quickly.</text><text x="760" y="474">Medium</text><text x="930" y="474">Draft</text>
<text x="88" y="578">US-04</text><text x="170" y="567">As a manager, I want exports to include filter context</text><text x="170" y="590">so that shared reports remain understandable.</text><text x="760" y="578">High</text><text x="930" y="578">Ready</text>
</g>
<line x1="60" y1="319" x2="1140" y2="319" stroke="#dfe5ec" stroke-width="2"/>
<line x1="60" y1="423" x2="1140" y2="423" stroke="#dfe5ec" stroke-width="2"/>
<line x1="60" y1="527" x2="1140" y2="527" stroke="#dfe5ec" stroke-width="2"/>
</svg>