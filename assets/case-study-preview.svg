<text x="1010" y="290" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#0b1f33">Outcome</text>
<g font-family="Arial" font-size="16" fill="#5f6b7a">
<text x="185" y="340" text-anchor="middle">Recurring reporting</text><text x="185" y="365" text-anchor="middle">errors and inconsistent</text><text x="185" y="390" text-anchor="middle">data definitions.</text>
<text x="460" y="340" text-anchor="middle">Mapped data flow,</text><text x="460" y="365" text-anchor="middle">validated sources, and</text><text x="460" y="390" text-anchor="middle">identified failure points.</text>
