<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f5f7fa"/><text x="55" y="62" font-family="Arial" font-size="30" font-weight="700" fill="#17324d">Store Inventory Exception Dashboard — Requirements Sample</text><text x="55" y="96" font-family="Arial" font-size="17" fill="#657583">Independent practice document with mock data</text><rect x="55" y="135" width="1090" height="500" rx="18" fill="#fff" stroke="#d8e0e8"/><rect x="55" y="135" width="1090" height="66" rx="18" fill="#17324d"/><rect x="55" y="183" width="1090" height="18" fill="#17324d"/><g font-family="Arial"><text x="80" y="178" font-size="18" font-weight="700" fill="#fff">ID</text><text x="190" y="178" font-size="18" font-weight="700" fill="#fff">Requirement</text><text x="860" y="178" font-size="18" font-weight="700" fill="#fff">Priority</text><text x="1010" y="178" font-size="18" font-weight="700" fill="#fff">Type</text><g font-size="16" fill="#445462"><text x="80" y="255">FR-01</text><text x="190" y="255">Display sales, units, availability and stockout KPIs.</text><text x="860" y="255">Must</text><text x="1010" y="255">Functional</text><text x="80" y="345">FR-02</text><text x="190" y="345">Filter by period, region, store and category.</text><text x="860" y="345">Must</text><text x="1010" y="345">Functional</text><text x="80" y="435">FR-03</text><text x="190" y="435">Flag availability below 90%.</text><text x="860" y="435">Must</text><text x="1010" y="435">Business rule</text><text x="80" y="525">NFR-01</text><text x="190" y="525">Open the main dashboard within 10 seconds.</text><text x="860" y="525">Should</text><text x="1010" y="525">Performance</text></g><g stroke="#dbe2e8"><line x1="55" y1="300" x2="1145" y2="300"/><line x1="55" y1="390" x2="1145" y2="390"/><line x1="55" y1="480" x2="1145" y2="480"/></g></g></svg>